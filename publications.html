<script src="static/js/tpl.js"></script>
<script>
/* ====================================================================
   @@PAGE@@ — every publication and every domestic talk, newest first and
   grouped by year, from the same DATA as the home page.
   ==================================================================== */
const SCHOLAR = DATA.links.find((l) => l.label === 'Scholar');

const LISTS = [
  { id: 'papers', title: { en: 'Publications', ja: '国際論文' }, kind: 'papers',
    items: DATA.publications, me: DATA.me, showDate: false,
    note: SCHOLAR && { href: SCHOLAR.href, label: { en: 'Google Scholar →', ja: 'Google Scholar →' } } },
  { id: 'domestic', title: { en: 'Domestic Presentations', ja: '国内発表' }, kind: 'talks',
    items: DATA.domestic, me: DATA.domesticMe, showDate: true }
];

const byYear = (list) => {
  const years = new Map();
  for (const p of newestFirst(list)) {
    const y = p.date.slice(0, 4);
    if (!years.has(y)) years.set(y, []);
    years.get(y).push(p);
  }
  return [...years];
};

mount('#sections', h`
  <div class="tiles">${LISTS.filter((l) => l.items.length).map((l) => h`
    <section class="tile" id="${l.id}">${secHead(l.title, l.note)}${tally(l.kind, l.items, l.me)}${byYear(l.items).map(([y, ps]) => h`
      <h3 class="pub-year reveal">${y}</h3>${ps.map((p) => pub(p, l.me, l.showDate))}`)}
    </section>`)}
  </div>`);

// The lists are built by script, so a link such as #domestic is followed here.
if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView({ behavior: 'instant' });
</script>
<script src="static/js/ui.js"></script>
